# Render Blueprint: creates the site and the inquiry-email server together.
# Secret values (marked sync: false) are entered in the Render dashboard, not stored here.
services:
  - type: web
    name: recess-inquiry-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false   # the site's URL, e.g. https://recess-booking.onrender.com (no trailing slash)

  - type: web
    name: recess-booking
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: PUBLIC_FORM_URL
        sync: false   # e.g. https://recess-inquiry-server.onrender.com/inquiry
